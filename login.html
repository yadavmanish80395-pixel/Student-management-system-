
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StudentHub | Login</title>
  <link rel="stylesheet" href="login.css">
</head>
<body>
  <main class="auth-card">
    <div class="auth-logo">🎓</div>
    <h1>Student<span>Hub</span></h1>
    <p class="subtitle">Welcome back! Login to your account.</p>

    <form id="loginForm">
      <label for="loginEmail">Email Address</label>
      <input id="loginEmail" type="email" placeholder="Enter your email" required>

      <label for="loginPassword">Password</label>
      <div class="password-wrap">
        <input id="loginPassword" type="password" placeholder="Enter your password" required>
        <button type="button" id="togglePassword">Show</button>
      </div>

      <button class="auth-button" type="submit">Login to Dashboard</button>
    </form>

    <p class="auth-switch">Don't have an account? <a href="signup.html">Create account</a></p>
    <p class="auth-note">StudentHub Demo Project</p>
  </main>
  <script src="login.js"></script>
</body>
</html>
